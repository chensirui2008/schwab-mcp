<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>离线状态 - Schwab MCP</title>
  <meta name="theme-color" content="#070b12">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <style>
    :root {
      --bg: #070b12;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border: rgba(148, 163, 184, 0.2);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.15);
      color: var(--warning);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
      color: var(--text);
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: var(--accent);
      color: #070b12;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      border: none;
      min-height: 44px;
      min-width: 44px;
      transition: opacity 0.2s;
    }
    .btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚡</div>
    <h1>当前处于离线状态</h1>
    <p>网络连接不可用，或服务器无法访问。为了安全起见，Schwab MCP 不在本地缓存账户、订单或凭据数据。请恢复网络后重试。</p>
    <button class="btn" onclick="window.location.reload()">重新连接</button>
  </div>
</body>
</html>
