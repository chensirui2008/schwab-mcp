name: Validate and deploy Worker

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Inject Production Configuration
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.PROD_OAUTH_KV_ID != ''
        run: |
          sed -i 's|"replace-with-your-kv-namespace-id"|"${{ vars.PROD_OAUTH_KV_ID }}"|g' wrangler.jsonc
          if [ -n "${{ vars.PROD_ALLOWED_GITHUB_USER_ID }}" ]; then
            sed -i 's|"replace-with-your-numeric-github-user-id"|"${{ vars.PROD_ALLOWED_GITHUB_USER_ID }}"|g' wrangler.jsonc
          fi
          if [ -n "${{ vars.PROD_GITHUB_CLIENT_ID }}" ]; then
            sed -i 's|"replace-with-your-github-client-id"|"${{ vars.PROD_GITHUB_CLIENT_ID }}"|g' wrangler.jsonc
          fi
          if [ -n "${{ vars.PROD_SCHWAB_REDIRECT_URI }}" ]; then
            sed -i 's|"https://<your-worker-name>.<your-subdomain>.workers.dev/auth/schwab/callback"|"${{ vars.PROD_SCHWAB_REDIRECT_URI }}"|g' wrangler.jsonc
          fi
          if [ -n "${{ vars.PROD_ENABLE_TRADING }}" ]; then
            sed -i 's|"ENABLE_TRADING": "false"|"ENABLE_TRADING": "${{ vars.PROD_ENABLE_TRADING }}"|g' wrangler.jsonc
          fi

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
