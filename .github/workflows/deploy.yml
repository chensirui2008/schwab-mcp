name: Validate and deploy Worker

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Inject Production Configuration
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          PROD_OAUTH_KV_ID: ${{ vars.PROD_OAUTH_KV_ID }}
          PROD_ALLOWED_GITHUB_USER_ID: ${{ vars.PROD_ALLOWED_GITHUB_USER_ID }}
          PROD_GITHUB_CLIENT_ID: ${{ vars.PROD_GITHUB_CLIENT_ID }}
          PROD_SCHWAB_REDIRECT_URI: ${{ vars.PROD_SCHWAB_REDIRECT_URI }}
          PROD_ENABLE_TRADING: ${{ vars.PROD_ENABLE_TRADING }}
        run: npm run configure:deploy

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npm run deploy
