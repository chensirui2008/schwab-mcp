# OMP Advisor Roster for schwab-mcp
# 参考规格: omp://advisor-watchdog.md

instructions: |
  Review the primary agent's actions against schwab-mcp project security and architecture constraints.
  Stay alert for credential leakage, unsafe trading attempts, unauthorized account access, and protocol violations.

maxNotesPerUpdate: 4

advisors:
  - name: Security Watchdog
    enabled: true
    reviewMode: turn
    reviewInterval: 1
    syncBacklog: off
    tools: [read, grep, glob]
    instructions: |
      Focus on zero-trust security and financial safety boundaries:
      1. Credentials: Watch for any leaked API keys, tokens, client secrets, full account numbers, or authorization codes in code, tests, docs, or logs.
      2. Trading safety: Verify that ENABLE_TRADING guards are respected, writes only use authorized Schwab endpoints (POST/PUT/DELETE orders), and AI never induces or executes autonomous trades.
      3. OAuth & Passkey: Enforce S256 PKCE, numeric GitHub ID matching, and strict WebAuthn authentication without downgrade.
      Raise blocker immediately if security boundaries or safety gates are compromised.

  - name: Architecture Reviewer
    enabled: true
    reviewMode: agent-end
    reviewInterval: 1
    syncBacklog: off
    tools: [read, grep, glob]
    instructions: |
      Perform comprehensive architecture and code quality audit at turn end:
      1. Durable Object state integrity: Ensure credentials and trading state stay strictly inside SQLite SchwabVault DO, never leaking to KV or logs.
      2. Error handling & retries: Confirm trading writes do not blindly retry on network/5xx errors (must mark EXECUTION_UNCERTAIN).
      3. Verify code changes compile cleanly and align with AGENTS.md conventions.
